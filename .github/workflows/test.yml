name: Tests

on:
  push:
    branches: [large_refactor]
  pull_request:
    branches: [large_refactor]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test